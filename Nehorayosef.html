<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הכנה למבחן תנופה - כיתה ט' | מחברת תרגול</title>
    <style>
        /* =====================================================================
           100% SELF-CONTAINED VANILLA CSS (NO EXTERNAL CDN DEPENDENCIES)
           ===================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-desk: #e5ebf3;
            --paper-bg: #fffef9;
            --paper-line: #e2e8f0;
            --margin-pink: #fda4af;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --amber: #fbbf24;
            --amber-dark: #f59e0b;
            --amber-text: #451a03;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --success-border: #86efac;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --danger-border: #fca5a5;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-desk);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            padding-bottom: 48px;
        }

        /* Math & Fractions */
        .math-ltr {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            direction: ltr;
            unicode-bidi: isolate;
            display: inline-block;
            font-weight: 700;
        }

        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            font-size: 0.9em;
            line-height: 1.15;
        }
        .frac > span:first-child {
            border-bottom: 2px solid currentColor;
            padding: 0 5px 2px;
        }
        .frac > span:last-child {
            padding: 2px 5px 0;
        }

        /* Sticky Header */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
            padding: 10px 12px;
        }

        .header-inner {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-guide {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(180deg, #fcd34d 0%, #fbbf24 100%);
            color: var(--amber-text);
            border: 1.5px solid #d97706;
            border-radius: 12px;
            padding: 9px 14px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(217, 119, 6, 0.18);
            transition: transform 0.12s ease, background 0.15s ease;
        }
        .btn-guide:active {
            transform: scale(0.97);
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pill-progress {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            color: #1e1b4b;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 800;
        }

        .pill-diff {
            color: var(--primary);
            font-weight: 800;
        }

        .pill-score {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #14532d;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 900;
        }

        .topic-selector-wrap {
            width: 100%;
        }

        .topic-select {
            width: 100%;
            background-color: #f1f5f9;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
        }
        .topic-select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        /* Main Container & Notebook Sheet */
        .main-wrapper {
            width: 100%;
            max-width: 820px;
            margin: 14px auto 0;
            padding: 0 10px;
        }

        .notebook-sheet {
            width: 100%;
            background-color: var(--paper-bg);
            background-image:
                linear-gradient(90deg, transparent 22px, var(--margin-pink) 22px, var(--margin-pink) 24px, transparent 24px),
                linear-gradient(var(--paper-line) 1px, transparent 1px);
            background-size: 100% 100%, 100% 2.15rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
            padding: 20px 34px 24px 16px;
            position: relative;
        }

        /* Spiral Holes on Right Edge */
        .spiral-holes {
            position: absolute;
            top: 20px;
            right: 5px;
            bottom: 20px;
            width: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }
        .spiral-hole {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: var(--bg-desk);
            box-shadow: inset 0 1.5px 2.5px rgba(0, 0, 0, 0.25);
        }

        /* Question Section */
        .question-section {
            padding-bottom: 18px;
            border-bottom: 2px solid #e2e8f0;
        }

        .question-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 12px;
        }

        .topic-badge {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e3a8a;
            font-size: 0.82rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .sub-level-badge {
            display: inline-block;
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .question-prompt {
            font-size: 1.12rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.65;
            word-wrap: break-word;
        }

        .eq-box-center {
            text-align: center;
            margin: 14px 0 6px;
        }

        .eq-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            padding: 12px 20px;
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.05);
            font-size: 1.35rem;
            font-weight: 800;
            max-width: 100%;
        }

        .brace-char {
            font-size: 2.6rem;
            font-weight: 300;
            color: #64748b;
            margin-right: 10px;
            line-height: 1;
            user-select: none;
        }

        .system-lines {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .visual-container {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .visual-container svg {
            width: 100%;
            max-width: 330px;
            height: auto;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .data-table {
            width: 100%;
            max-width: 380px;
            margin: 12px auto;
            border-collapse: collapse;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
            font-size: 0.95rem;
            text-align: center;
        }
        .data-table th, .data-table td {
            border: 1px solid #cbd5e1;
            padding: 8px 10px;
        }
        .data-table tr:first-child {
            background-color: #eff6ff;
        }

        /* Scratchpad Section */
        .scratchpad-section {
            margin-top: 18px;
            width: 100%;
        }

        .scratchpad-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .scratchpad-title {
            font-size: 0.98rem;
            font-weight: 800;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pad-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .btn-pad-mode {
            border: 1px solid #cbd5e1;
            background: #e2e8f0;
            color: #334155;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 800;
            padding: 6px 11px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-pad-mode.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.25);
        }

        .btn-pad-clear {
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: var(--danger);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .scratchpad-textarea {
            display: block;
            width: 100%;
            min-height: 145px;
            background-color: #fcfdfe;
            background-image: linear-gradient(#dbeafe 1px, transparent 1px);
            background-size: 100% 2rem;
            line-height: 2rem;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1rem;
            color: var(--text-main);
            direction: ltr;
            text-align: left;
            resize: vertical;
        }
        .scratchpad-textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .symbol-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            direction: ltr;
        }

        .btn-sym {
            min-width: 36px;
            height: 36px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: ui-monospace, monospace;
            font-size: 0.95rem;
            font-weight: 800;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-sym:active {
            background: #cbd5e1;
        }

        /* Freehand Drawing Canvas */
        .draw-box {
            width: 100%;
            position: relative;
            border: 2px solid #93c5fd;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
        }

        #handwriting-canvas {
            display: block;
            width: 100%;
            height: 210px;
            touch-action: none;
            cursor: crosshair;
        }

        .brush-toolbar {
            position: absolute;
            bottom: 8px;
            left: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 5px 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #94a3b8;
            cursor: pointer;
        }

        .btn-eraser {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.78rem;
            font-weight: 800;
            color: #334155;
            cursor: pointer;
        }

        /* Final Answer Area */
        .answer-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 2px solid #e2e8f0;
        }

        .answer-card {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 16px 14px;
        }

        .answer-card-title {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 14px;
        }

        .inputs-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .input-group {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
        }

        .input-box-stack {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .btn-minus-under {
            width: 96px;
            height: 32px;
            background: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-family: ui-monospace, monospace;
            font-size: 1.2rem;
            font-weight: 900;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: background 0.12s ease, transform 0.1s ease;
        }
        .btn-minus-under:active {
            background: #cbd5e1;
            transform: scale(0.96);
        }

        .input-label {
            font-size: 1.05rem;
            font-weight: 900;
            color: #1e293b;
        }

        .final-input {
            width: 96px;
            padding: 8px 6px;
            font-family: ui-monospace, monospace;
            font-size: 1.35rem;
            font-weight: 900;
            text-align: center;
            direction: ltr;
            unicode-bidi: plaintext;
            color: var(--text-main);
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-bottom: 3.5px solid var(--primary);
            border-radius: 10px;
            transition: all 0.18s ease;
        }
        .final-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .final-input.correct {
            border-color: var(--success);
            border-bottom-color: #15803d;
            background: var(--success-bg);
            color: #14532d;
        }
        .final-input.wrong {
            border-color: var(--danger);
            border-bottom-color: #b91c1c;
            background: var(--danger-bg);
            color: #7f1d1d;
            animation: shake 0.35s ease-in-out;
        }

        /* Action Buttons */
        .actions-row {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-check {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 26px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
            transition: transform 0.12s ease, background 0.15s ease;
        }
        .btn-check:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 11px 15px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
        }
        .btn-secondary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-sol {
            background: #e0e7ff;
            color: #1e1b4b;
            border: 1px solid #c7d2fe;
            border-radius: 12px;
            padding: 11px 15px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
        }

        .feedback-banner {
            margin-top: 16px;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.98rem;
            font-weight: 800;
            line-height: 1.5;
        }
        .feedback-banner.success {
            background: var(--success-bg);
            border: 2px solid var(--success);
            color: #14532d;
        }
        .feedback-banner.warning {
            background: #fef3c7;
            border: 1.5px solid #f59e0b;
            color: #78350f;
        }
        .feedback-banner.error {
            background: var(--danger-bg);
            border: 1.5px solid var(--danger);
            color: #7f1d1d;
        }

        .next-wrap {
            margin-top: 14px;
            text-align: center;
        }

        .btn-next {
            background: var(--success);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 13px 28px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
        }

        .worked-solution {
            margin-top: 16px;
            background: #ffffff;
            border: 2px solid #c7d2fe;
            border-radius: 14px;
            padding: 14px;
            text-align: right;
        }
        .worked-solution h4 {
            color: #1e1b4b;
            font-size: 1rem;
            font-weight: 900;
            border-bottom: 1px solid #e0e7ff;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .worked-solution-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Modal Overlay ("הסבר איך לפתור (דוגמה)") */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(15, 23, 42, 0.68);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow-y: auto;
        }

        .modal-sheet {
            width: 100%;
            max-width: 640px;
            max-height: 90vh;
            overflow-y: auto;
            background-color: var(--paper-bg);
            background-image:
                linear-gradient(90deg, transparent 22px, var(--margin-pink) 22px, var(--margin-pink) 24px, transparent 24px),
                linear-gradient(var(--paper-line) 1px, transparent 1px);
            background-size: 100% 100%, 100% 2.15rem;
            border: 2px solid #94a3b8;
            border-radius: 18px;
            padding: 18px 34px 22px 16px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .btn-close-modal {
            position: sticky;
            top: 0;
            float: left;
            background: #1e293b;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .modal-tag {
            display: inline-block;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #78350f;
            font-size: 0.78rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 6px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 14px;
        }

        .guide-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.96rem;
        }

        .guide-box {
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 12px;
        }

        .hl-yellow {
            background: linear-gradient(104deg, rgba(254,240,138,0) 1%, rgba(254,240,138,1) 3%, rgba(254,240,138,0.9) 94%, rgba(254,240,138,0) 99%);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .hl-green-circle {
            display: inline-block;
            border: 2.5px solid var(--success);
            border-radius: 999px;
            padding: 2px 14px;
            background: rgba(220, 252, 231, 0.5);
            color: #14532d;
            font-weight: 900;
        }

        .step-arrow {
            display: inline-block;
            color: var(--danger);
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 1px 7px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .hidden {
            display: none !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 80;
        }

        /* Desktop Enhancements */
        @media (min-width: 641px) {
            .top-header {
                padding: 12px 20px;
            }
            .topic-selector-wrap {
                width: auto;
                flex: 1;
                max-width: 310px;
            }
            .main-wrapper {
                margin-top: 24px;
                padding: 0 20px;
            }
            .notebook-sheet {
                background-image:
                    linear-gradient(90deg, transparent 36px, var(--margin-pink) 36px, var(--margin-pink) 38px, transparent 38px),
                    linear-gradient(var(--paper-line) 1px, transparent 1px);
                padding: 28px 52px 32px 28px;
            }

        // =====================================================================
        // APP STATE & INTERACTION LOGIC
        // =====================================================================
        let currentIdx = 0;
        let solvedSet = new Set();

        function populateTopicDropdown() {
            const select = document.getElementById('topic-select');
            if (!select) return;
            select.innerHTML = QUESTIONS.map((q, idx) =>
                `<option value="${idx}">שאלה ${idx + 1}: ${q.topicName} (${idx % 2 === 0 ? 'א' : 'ב'})</option>`
            ).join('');
        }

        function renderCurrentQuestion() {
            const q = QUESTIONS[currentIdx];
            if (!q) return;

            document.getElementById('topic-select').value = currentIdx;
            document.getElementById('q-progress-text').textContent = `שאלה ${currentIdx + 1} / ${QUESTIONS.length}`;
            document.getElementById('q-diff-badge').textContent = currentIdx % 2 === 0 ? 'רמה בסיסית' : 'רמה מתקדמת';
            document.getElementById('topic-pill').textContent = `נושא ${q.topicName}`;
            document.getElementById('sub-level-pill').textContent = q.levelLabel;

            document.getElementById('question-body').innerHTML = q.prompt;
            const visualEl = document.getElementById('question-visual');
            if (q.visual) {
                visualEl.innerHTML = q.visual;
                visualEl.classList.remove('hidden');
            } else {
                visualEl.innerHTML = '';
                visualEl.classList.add('hidden');
            }

            // Render Final Inputs + Clean '-' Button Underneath Each Box
            const inputsContainer = document.getElementById('final-inputs-container');
            inputsContainer.innerHTML = q.inputs.map((inp, i) => `
                <div class="input-group">
                    <label for="ans-field-${i}" class="input-label">${inp.label}</label>
                    <div class="input-box-stack">
                        <input type="text" inputmode="decimal" id="ans-field-${i}" placeholder="${inp.placeholder}" autocomplete="off"
                            class="final-input" onkeydown="handleInputEnter(event, ${i})">
                        <button type="button" class="btn-minus-under" onclick="toggleMinus(${i})" title="הוסף / הסר מינוס">-</button>
                    </div>
                </div>
            `).join('');

            // Reset Feedback & Solution
            const banner = document.getElementById('feedback-banner');
            banner.className = 'feedback-banner hidden';
            banner.innerHTML = '';

            document.getElementById('worked-solution-box').classList.add('hidden');
            document.getElementById('worked-solution-body').innerHTML = q.solution;

            const nextWrap = document.getElementById('next-question-wrap');
            if (solvedSet.has(q.id)) {
                nextWrap.classList.remove('hidden');
            } else {
                nextWrap.classList.add('hidden');
            }

            document.getElementById('next-btn-label').textContent =
                currentIdx < QUESTIONS.length - 1 ? 'לשאלה הבאה ←' : 'סיימת הכל! חזרה להתחלה ↺';

            document.getElementById('prev-btn').disabled = currentIdx === 0;
        }

        function handleInputEnter(e, index) {
            if (e.key !== 'Enter') return;
            const q = QUESTIONS[currentIdx];
            if (index < q.inputs.length - 1) {
                document.getElementById(`ans-field-${index + 1}`).focus();
            } else {
                checkCurrentAnswer();
            }
        }

        // Normalize all Unicode minus/dash characters to standard ASCII '-'
        function normalizeDash(str) {
            return String(str).replace(/[\u2212\u2013\u2014\u2010\u2011\uFE63\uFF0D]/g, '-');
        }

        // Toggle leading '-' on the answer input box
        function toggleMinus(index) {
            const el = document.getElementById(`ans-field-${index}`);
            if (!el) return;

            let val = normalizeDash(el.value).trim();
            el.classList.remove('correct', 'wrong');

            if (val === '') {
                el.value = '-';
            } else if (val === '-') {
                el.value = '';
            } else if (val.startsWith('-')) {
                el.value = val.slice(1).trim();
            } else {
                val = val.replace(/^\+/, '').trim();
                el.value = '-' + val;
            }

            el.focus();
            try {
                const len = el.value.length;
                el.setSelectionRange(len, len);
            } catch (err) {
                // Safe fallback
            }
        }

        // Parse user input robustly (supports negatives, decimals, commas, and fractions like -1/2)
        function parseMathAnswer(rawStr) {
            let clean = normalizeDash(rawStr)
                .replace(/\s+/g, '')
                .replace(/,/g, '.')
                .replace(/^[a-zA-Zא-ת]+=/, '');

            if (clean === '' || clean === '-' || clean === '+' || clean === '.') {
                return NaN;
            }

            if (/^[+-]?\d+(\.\d+)?\/[+-]?\d+(\.\d+)?$/.test(clean)) {
                const parts = clean.split('/');
                const num = Number(parts[0]);
                const den = Number(parts[1]);
                if (den === 0) return NaN;
                return num / den;
            }

            return Number(clean);
        }

        function checkCurrentAnswer() {
            const q = QUESTIONS[currentIdx];
            const banner = document.getElementById('feedback-banner');
            let allFilled = true;
            let hasInvalidFormat = false;
            let allCorrect = true;

            q.inputs.forEach((inp, i) => {
                const el = document.getElementById(`ans-field-${i}`);
                const raw = normalizeDash(el.value).trim();

                if (raw === '' || raw === '-') {
                    allFilled = false;
                    return;
                }

                const val = parseMathAnswer(raw);
                if (Number.isNaN(val)) {
                    hasInvalidFormat = true;
                    el.classList.remove('correct', 'wrong');
                    void el.offsetWidth;
                    el.classList.add('wrong');
                    return;
                }

                const isOk = Math.abs(val - inp.answer) < 0.05;
                el.classList.remove('correct', 'wrong');
                if (isOk) {
                    el.classList.add('correct');
                } else {
                    void el.offsetWidth;
                    el.classList.add('wrong');
                    allCorrect = false;
                }
            });

            if (!allFilled) {
                banner.className = 'feedback-banner warning';
                banner.textContent = 'נא למלא מספר מלא בכל משבצות התשובה לפני הבדיקה 🙂';
                return;
            }

            if (hasInvalidFormat) {
                banner.className = 'feedback-banner warning';
                banner.textContent = 'נא להזין מספר תקין (לדוגמה: -18 או 2.3) 🙂';
                return;
            }

            if (allCorrect) {
                solvedSet.add(q.id);
                document.getElementById('score-text').textContent = solvedSet.size;
                banner.className = 'feedback-banner success';
                banner.innerHTML = '🎉 כל הכבוד! תשובה מדויקת!';
                document.getElementById('next-question-wrap').classList.remove('hidden');
                launchConfetti();
            } else {
                banner.className = 'feedback-banner error';
                banner.innerHTML = '❌ לא מדויק — בדוק שוב את החישוב בטיוטה (וודא שלא שכחת מינוס!), או לחץ למעלה על <strong>"הסבר איך לפתור (דוגמה)"</strong>.';
            }
        }

        function toggleFullSolution() {
            document.getElementById('worked-solution-box').classList.toggle('hidden');
        }

        function nextQuestion() {
            clearScratchpad();
            currentIdx = currentIdx < QUESTIONS.length - 1 ? currentIdx + 1 : 0;
            renderCurrentQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                clearScratchpad();
                currentIdx--;
                renderCurrentQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestion(idx) {
            clearScratchpad();
            currentIdx = idx;
            renderCurrentQuestion();
        }

        // Modal Guide Controls
        function openGuideModal() {
            const q = QUESTIONS[currentIdx];
            const guide = TOPICS_GUIDE[q.topicId];
            document.getElementById('guide-modal-title').textContent = guide.title;
            document.getElementById('guide-modal-content').innerHTML = guide.html;
            document.getElementById('guide-modal').classList.remove('hidden');
        }

        function closeGuideModal() {
            document.getElementById('guide-modal').classList.add('hidden');
        }

        // Scratchpad Logic
        let canvas, ctx, isDrawing = false;
        let brushColor = '#0f172a', brushSize = 2.5;

        function switchPadMode(mode) {
            const typeBtn = document.getElementById('btn-mode-type');
            const drawBtn = document.getElementById('btn-mode-draw');
            const typeBox = document.getElementById('pad-type-box');
            const drawBox = document.getElementById('pad-draw-box');

            if (mode === 'type') {
                typeBtn.classList.add('active');
                drawBtn.classList.remove('active');
                typeBox.classList.remove('hidden');
                drawBox.classList.add('hidden');
            } else {
                drawBtn.classList.add('active');
                typeBtn.classList.remove('active');
                typeBox.classList.add('hidden');
                drawBox.classList.remove('hidden');
                setupCanvasSize();
            }
        }

        function insertSymbol(sym) {
            const ta = document.getElementById('scratchpad-textarea');
            const s = ta.selectionStart, e = ta.selectionEnd;
            ta.value = ta.value.slice(0, s) + sym + ta.value.slice(e);
            ta.focus();
            ta.selectionStart = ta.selectionEnd = s + sym.length;
        }

        function setBrush(color, size) {
            brushColor = color;
            brushSize = size;
        }

        function clearScratchpad() {
            const ta = document.getElementById('scratchpad-textarea');
            if (ta) ta.value = '';
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawRuledLines();
            }
        }

        function initHandwritingCanvas() {
            canvas = document.getElementById('handwriting-canvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');

            const coords = (e) => {
                const r = canvas.getBoundingClientRect();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: cx - r.left, y: cy - r.top };
            };

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = coords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawing) return;
                const p = coords(e);
                ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize; ctx.lineCap = 'round';
                ctx.lineTo(p.x, p.y); ctx.stroke();
            });
            window.addEventListener('mouseup', () => { isDrawing = false; });

            canvas.addEventListener('touchstart', (e) => { isDrawing = true; const p = coords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const p = coords(e);
                ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize; ctx.lineCap = 'round';
                ctx.lineTo(p.x, p.y); ctx.stroke();
            }, { passive: false });
            canvas.addEventListener('touchend', () => { isDrawing = false; });
        }

        function setupCanvasSize() {
            if (!canvas) return;
            const r = canvas.getBoundingClientRect();
            if (r.width > 0 && canvas.width !== r.width) {
                canvas.width = r.width;
                canvas.height = r.height;
                drawRuledLines();
            }
        }

        function drawRuledLines() {
            if (!ctx || !canvas) return;
            ctx.save();
            ctx.strokeStyle = '#dbeafe';
            ctx.lineWidth = 1;
            for (let y = 32; y < canvas.height; y += 32) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
            ctx.restore();
        }

        function launchConfetti() {
            const c = document.getElementById('confetti-canvas');
            if (!c) return;
            const g = c.getContext('2d');
            c.width = window.innerWidth; c.height = window.innerHeight;
            const cols = ['#2563eb', '#16a34a', '#f59e0b', '#ec4899', '#8b5cf6'];
            const bits = Array.from({ length: 65 }, () => ({
                x: Math.random() * c.width, y: -20 - Math.random() * 60,
                w: 8, h: 6, col: cols[Math.floor(Math.random() * cols.length)],
                vx: (Math.random() - 0.5) * 4, vy: 3 + Math.random() * 4,
                rot: Math.random() * 360, vr: (Math.random() - 0.5) * 10
            }));
            let f = 0;
            function step() {
                g.clearRect(0, 0, c.width, c.height);
                bits.forEach(b => {
                    b.x += b.vx; b.y += b.vy; b.rot += b.vr;
                    g.save(); g.translate(b.x, b.y); g.rotate(b.rot * Math.PI / 180);
                    g.fillStyle = b.col; g.fillRect(-4, -3, b.w, b.h); g.restore();
                });
                if (++f < 90) requestAnimationFrame(step);
                else g.clearRect(0, 0, c.width, c.height);
            }
            step();
        }

        // Reliable initialization on both DOMContentLoaded and immediate load
        let appInitialized = false;
        function initApp() {
            if (appInitialized) return;
            appInitialized = true;
            populateTopicDropdown();
            initHandwritingCanvas();
            renderCurrentQuestion();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
        window.addEventListener('load', initApp);
    </script>
</body>
</html>
